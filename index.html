<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#10203a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>부루마블 vs AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="stage">
      <div class="canvas-wrap">
        <canvas id="scene"></canvas>
        <div class="hud-top">
          <span class="chip-info" id="round-info">-</span>
          <span class="chip-info" id="fund-info"></span>
          <button id="panel-btn" class="icon-btn" title="자세히 보기">📋</button>
          <button id="sound-btn" class="icon-btn" title="소리">🔊</button>
        </div>
        <div class="toasts" id="toasts"></div>
      </div>
      <div class="mini-players" id="mini-players"></div>
      <div class="hud">
        <div class="message" id="message"></div>
        <button id="roll-btn" disabled>🎲 던지기</button>
      </div>
      <div class="cell-info" id="cell-info">칸을 누르면 정보가 보여요 · 드래그로 회전, 두 손가락으로 확대</div>
    </div>

    <aside class="side">
      <div id="players"></div>
      <div class="log-box">
        <div class="log-title">게임 기록</div>
        <div id="log"></div>
      </div>
    </aside>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div id="modal-buttons"></div>
    </div>
  </div>

  <script src="three.min.js"></script>
  <script src="cannon.min.js"></script>
  <script src="peerjs.min.js"></script>
  <script src="sound.js"></script>
  <script src="net.js"></script>
  <script src="board3d.js"></script>
  <script src="ai.js"></script>
  <script src="game.js"></script>
</body>
</html>
